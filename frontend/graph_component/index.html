<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;background:#f0f3ed;font-family:system-ui,'Microsoft YaHei',sans-serif;color:#304e40}svg{width:100%;height:455px;display:block;border-radius:12px;border:1px solid #dbe4d8;touch-action:none;background:radial-gradient(#cbd8c9 0.7px,transparent 0.7px);background-size:18px 18px}text{font-size:11px;paint-order:stroke;stroke:#f0f3ed;stroke-width:4px;stroke-linejoin:round;fill:#384f43;pointer-events:none}circle{cursor:pointer;stroke-width:2px;stroke:#fff;transition:filter .15s}circle:hover,circle:focus{filter:brightness(1.15);stroke:#173d2e;stroke-width:3px;outline:none}.tip{position:absolute;background:#183f32;color:white;padding:7px 11px;border-radius:5px;font-size:12px;pointer-events:none;max-width:310px;display:none;z-index:5}.hint{font-size:10px;fill:#8c9b8a;stroke:none}
</style></head><body><div class="tip" id="tip"></div><svg id="svg" role="img" aria-label="电影局部关系图谱" viewBox="0 0 760 455"><g id="scene"></g></svg><script>
const svg=document.querySelector('#svg'), scene=document.querySelector('#scene'),tip=document.querySelector('#tip');
let model,drag=null,moved=false,scale=1,offset={x:0,y:0},lastSignature='';
const colors={center:'#205e49',movie:'#608a9a',genre:'#78a381',tag:'#c39b5c',user:'#987ab0'};
function send(type,data={}){parent.postMessage({isStreamlitMessage:true,type,...data},'*')}
function el(tag,attrs){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));return e}
function clickNode(n){send('streamlit:setComponentValue',{value:{kind:n.kind,label:n.label,movieId:n.movieId,userId:n.userId,nonce:Date.now()},dataType:'json'})}
function pt(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(scene.getScreenCTM().inverse())}
function draw(){scene.replaceChildren();const byId=Object.fromEntries(model.nodes.map(n=>[n.id,n]));for(const edge of model.edges){const a=byId[edge.source],b=byId[edge.target];scene.append(el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:a.kind==='center'?'#9bb7a3':'#c5d3c5','stroke-width':a.kind==='center'?1.8:1}));}
for(const n of model.nodes){const r=n.kind==='center'?28:n.kind==='movie'?17:11;const group=el('g',{});const c=el('circle',{cx:n.x,cy:n.y,r,fill:colors[n.kind],tabindex:0,role:'button','aria-label':n.label});const title=el('title',{});title.textContent=n.label;c.append(title);c.addEventListener('pointerdown',e=>{drag=n;moved=false;svg.setPointerCapture(e.pointerId);e.preventDefault()});c.addEventListener('click',()=>{if(!moved)clickNode(n)});c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();clickNode(n)}});c.addEventListener('pointerenter',e=>{tip.textContent=n.label;tip.style.display='block';tip.style.left=Math.min(e.clientX+12,window.innerWidth-240)+'px';tip.style.top=Math.max(0,e.clientY-32)+'px'});c.addEventListener('pointerleave',()=>tip.style.display='none');group.append(c);const t=el('text',{x:n.x,y:n.y+r+17,'text-anchor':'middle','font-weight':n.kind==='center'?700:400});t.textContent=n.label.length>24?n.label.slice(0,23)+'…':n.label;group.append(t);scene.append(group)}scene.setAttribute('transform',`translate(${offset.x} ${offset.y}) scale(${scale})`)}
function layout(data){model=JSON.parse(JSON.stringify(data));const center=model.nodes.find(n=>n.kind==='center');center.x=380;center.y=218;const fs=model.nodes.filter(n=>['genre','tag'].includes(n.kind));const ms=model.nodes.filter(n=>['movie','user'].includes(n.kind));fs.forEach((n,i)=>{let a=-Math.PI/2+i*2*Math.PI/Math.max(fs.length,1);n.x=380+Math.cos(a)*155;n.y=218+Math.sin(a)*122});ms.forEach((n,i)=>{let a=-Math.PI/2+(i+.45)*2*Math.PI/Math.max(ms.length,1);n.x=380+Math.cos(a)*290;n.y=218+Math.sin(a)*180});scale=1;offset={x:0,y:0};draw()}
svg.addEventListener('pointermove',e=>{if(drag){moved=true;let p=pt(e);drag.x=Math.max(35,Math.min(725,p.x));drag.y=Math.max(25,Math.min(410,p.y));draw();tip.style.display='none'}});svg.addEventListener('pointerup',()=>{if(drag&&!moved)clickNode(drag);drag=null;moved=true});svg.addEventListener('pointercancel',()=>drag=null);svg.addEventListener('wheel',e=>{e.preventDefault();scale=Math.max(.65,Math.min(1.8,scale-e.deltaY*.001));offset={x:380*(1-scale),y:225*(1-scale)};draw()},{passive:false});svg.addEventListener('dblclick',e=>{if(e.target===svg){scale=1;offset={x:0,y:0};draw()}});
window.addEventListener('message',e=>{if(e.source!==parent||e.data.type!=='streamlit:render')return;let data=e.data.args.graph;let signature=JSON.stringify(data);if(signature!==lastSignature){lastSignature=signature;layout(data)}send('streamlit:setFrameHeight',{height:460})});send('streamlit:componentReady',{apiVersion:1});send('streamlit:setFrameHeight',{height:460});
</script></body></html>
